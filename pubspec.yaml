name: pos_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.4+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3
  package_info_plus: ^8.0.0
  intl: ^0.19.0
  sqflite: ^2.3.3
  path: ^1.9.0
  fl_chart: ^0.68.0
  connectivity_plus: ^6.0.3
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  screenshot: ^3.0.0
  path_provider: ^2.1.3
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  print_bluetooth_thermal: 1.2.1
  esc_pos_utils_plus: ^2.0.0
  image: ^4.0.0
  ota_update: ^7.1.0
  flutter_colorpicker: ^1.1.0
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
